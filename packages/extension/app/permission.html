<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NarWal: microphone</title><link rel="stylesheet" href="ui.css"></head>
<body>
<main>
  <h1>Allow the microphone</h1>
  <p class="note">NarWal records your voice while you walk through the page. Chrome asks once; the recording itself is saved only on this computer.</p>
  <div id="problem" class="error" role="alert" hidden></div>
  <div class="row">
    <button id="allow" class="primary">Allow microphone</button>
  </div>
  <p class="note">After that, press the NarWal button in the toolbar again to start.</p>
</main>
<script src="dist/permission.js"></script>
</body>
</html>
