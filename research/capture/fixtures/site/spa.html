<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SPA</title><script src="/origins.js"></script><script src="/fixture.js"></script></head>
<body>
<h1>SPA</h1>
<button id="route-1">Route 1</button> <button id="route-2">Route 2</button> <a id="hash" href="#section">Hash</a>
<main id="view">home</main>
<script>
function render(){ document.getElementById("view").textContent = "view:" + location.pathname + location.hash; }
document.getElementById("route-1").onclick = () => { history.pushState({}, "", "/spa/route-1"); render(); };
document.getElementById("route-2").onclick = () => { history.pushState({}, "", "/spa/route-2"); render(); };
addEventListener("popstate", render); addEventListener("hashchange", render); render();
</script>
</body>
</html>
